<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="39" height="31" viewBox="0 0 39 31">
  <title>车站（中式站房）</title>
  <defs>
    <linearGradient id="st-roof-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB4E4"/>
      <stop offset="1" stop-color="#4886C7"/>
    </linearGradient>
    <linearGradient id="st-body-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86BAE6"/>
      <stop offset="1" stop-color="#5E9BD6"/>
    </linearGradient>
    <linearGradient id="st-roof-low" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E9BD6"/>
      <stop offset="1" stop-color="#2E6BA8"/>
    </linearGradient>
    <linearGradient id="st-body-low" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E90CB"/>
      <stop offset="1" stop-color="#33689F"/>
    </linearGradient>
  </defs>

  <!-- 尖顶 -->
  <path d="M 19.5 1.2 L 21.8 5.4 L 17.2 5.4 Z" fill="#3E81C2"/>

  <!-- 上层屋檐 -->
  <path d="M 4 10.4 Q 19.5 2.6 35 10.4 Q 19.5 6.6 4 10.4 Z" fill="url(#st-roof-up)"/>
  <!-- 上层楼身 -->
  <rect x="10.5" y="8" width="18" height="7" fill="url(#st-body-up)"/>
  <g fill="#EAF3FC">
    <rect x="12.6" y="10" width="3.8" height="3.6"/>
    <rect x="17.6" y="10" width="3.8" height="3.6"/>
    <rect x="22.6" y="10" width="3.8" height="3.6"/>
  </g>

  <!-- 下层屋檐 -->
  <path d="M 0 19.2 Q 19.5 11.2 39 19.2 Q 19.5 15.3 0 19.2 Z" fill="url(#st-roof-low)"/>
  <!-- 下层楼身 -->
  <rect x="6.5" y="17.4" width="26" height="7.6" fill="url(#st-body-low)"/>
  <rect x="17" y="19.4" width="5" height="5.6" fill="#D6E8F8"/>
  <g fill="#BBD8F1">
    <rect x="10" y="19.4" width="3.4" height="5.6"/>
    <rect x="25.6" y="19.4" width="3.4" height="5.6"/>
  </g>

  <!-- 底座 -->
  <rect x="3.5" y="24.6" width="32" height="3.4" rx="1" fill="#2A629C"/>
</svg>
