<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="172" height="214" viewBox="0 0 172 214">
  <title>定制适配 APP · 工业手持终端</title>
  <defs>
    <linearGradient id="ht-body" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#F1EDE2"/>
      <stop offset="0.45" stop-color="#E4DFD2"/>
      <stop offset="1" stop-color="#CFC8B8"/>
    </linearGradient>
    <linearGradient id="ht-screen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#8E9C84"/>
      <stop offset="0.5" stop-color="#78876D"/>
      <stop offset="1" stop-color="#5F6D55"/>
    </linearGradient>
    <linearGradient id="ht-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0DACD"/>
      <stop offset="1" stop-color="#C6BFB0"/>
    </linearGradient>
  </defs>

  <!-- 天线 -->
  <path d="M 68 26 L 68 10" stroke="#8C8878" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 116 26 L 116 1" stroke="#8C8878" stroke-width="3.2" stroke-linecap="round"/>
  <!-- 顶部提手 -->
  <rect x="76" y="19" width="28" height="6" rx="3" fill="#C9C2B2" stroke="#AFA896" stroke-width="1.2"/>

  <!-- 腕带 -->
  <path d="M 26 150 C 8 158 8 182 24 192" fill="none" stroke="#33322E"
        stroke-width="7" stroke-linecap="round"/>

  <!-- 机身 -->
  <rect x="22" y="22" width="128" height="182" rx="11" fill="url(#ht-body)"
        stroke="#B5AE9D" stroke-width="2"/>
  <!-- 侧边按钮 -->
  <rect x="19.5" y="96" width="4" height="14" rx="1.8" fill="#A8A192"/>
  <rect x="19.5" y="116" width="4" height="10" rx="1.8" fill="#A8A192"/>
  <rect x="148.5" y="150" width="4" height="12" rx="1.8" fill="#A8A192"/>

  <!-- 屏幕 -->
  <rect x="30" y="33" width="97" height="90" rx="4.5" fill="#55564F"/>
  <rect x="38" y="41" width="81" height="74" rx="2" fill="url(#ht-screen)"/>
  <rect x="38" y="41" width="81" height="17" rx="2" fill="#FFFFFF" opacity="0.06"/>
  <rect x="38" y="41" width="81" height="74" rx="2" fill="none" stroke="#3E3F39" stroke-width="1.4"/>

  <!-- 屏幕下方功能键 -->
  <g fill="url(#ht-key)" stroke="#B5AE9D" stroke-width="1">
    <rect x="42" y="129" width="12" height="8" rx="2.4"/>
    <rect x="58" y="129" width="12" height="8" rx="2.4"/>
    <rect x="74" y="129" width="12" height="8" rx="2.4"/>
    <rect x="90" y="129" width="12" height="8" rx="2.4"/>
    <rect x="106" y="129" width="12" height="8" rx="2.4"/>
  </g>

  <!-- 主键盘 4 列 x 4 行 -->
  <g fill="url(#ht-key)" stroke="#B5AE9D" stroke-width="1">
    <rect x="40" y="144" width="17" height="11" rx="3"/>
    <rect x="60" y="144" width="17" height="11" rx="3"/>
    <rect x="80" y="144" width="17" height="11" rx="3"/>
    <rect x="100" y="144" width="17" height="11" rx="3"/>

    <rect x="40" y="159" width="17" height="11" rx="3"/>
    <rect x="60" y="159" width="17" height="11" rx="3"/>
    <rect x="80" y="159" width="17" height="11" rx="3"/>
    <rect x="100" y="159" width="17" height="11" rx="3"/>

    <rect x="40" y="174" width="17" height="11" rx="3"/>
    <rect x="60" y="174" width="17" height="11" rx="3"/>
    <rect x="80" y="174" width="17" height="11" rx="3"/>
    <rect x="100" y="174" width="17" height="11" rx="3"/>

    <rect x="40" y="189" width="17" height="11" rx="3"/>
    <rect x="60" y="189" width="17" height="11" rx="3"/>
    <rect x="80" y="189" width="17" height="11" rx="3"/>
    <rect x="100" y="189" width="17" height="11" rx="3"/>
  </g>

  <!-- 右侧功能键列 -->
  <g stroke="#B5AE9D" stroke-width="1">
    <rect x="122" y="144" width="18" height="11" rx="3" fill="#C6BFB0"/>
    <rect x="122" y="159" width="18" height="11" rx="3" fill="#DE6B47"/>
    <rect x="122" y="174" width="18" height="11" rx="3" fill="#C6BFB0"/>
    <rect x="122" y="189" width="18" height="11" rx="3" fill="#4FAE55"/>
  </g>

  <!-- 机身描边（覆盖按键边缘） -->
  <rect x="22" y="22" width="128" height="182" rx="11" fill="none"
        stroke="#A8A192" stroke-width="1.6"/>
</svg>
