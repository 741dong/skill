<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="112" height="209" viewBox="0 0 112 209">
  <title>既有终端设备 · 手机端 App</title>
  <defs>
    <linearGradient id="ph-header" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2E86E8"/>
      <stop offset="1" stop-color="#1668CE"/>
    </linearGradient>
    <linearGradient id="ph-frame" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#48525F"/>
      <stop offset="0.5" stop-color="#333C48"/>
      <stop offset="1" stop-color="#48525F"/>
    </linearGradient>
    <clipPath id="ph-screen">
      <rect x="7.5" y="7.5" width="97" height="194" rx="12.5"/>
    </clipPath>
  </defs>

  <!-- 机身 -->
  <rect x="2" y="2" width="108" height="205" rx="16" fill="url(#ph-frame)"/>
  <!-- 侧边按钮 -->
  <rect x="1" y="52" width="2.6" height="11" rx="1.3" fill="#2A323C"/>
  <rect x="1" y="68" width="2.6" height="16" rx="1.3" fill="#2A323C"/>
  <rect x="108.4" y="60" width="2.6" height="18" rx="1.3" fill="#2A323C"/>
  <!-- 屏幕底色 -->
  <rect x="7.5" y="7.5" width="97" height="194" rx="12.5" fill="#F2F5F9"/>

  <g clip-path="url(#ph-screen)">
    <!-- 顶部蓝色区域 -->
    <rect x="7.5" y="7.5" width="97" height="60" fill="url(#ph-header)"/>
    <circle cx="88" cy="44" r="14" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="88" cy="44" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.22"/>

    <!-- 返回箭头 -->
    <path d="M 18 24 L 12.5 29 L 18 34" fill="none" stroke="#FFFFFF" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 标题条 -->
    <rect x="46" y="25.5" width="22" height="4.6" rx="2.3" fill="#FFFFFF"/>
    <!-- 右上胶囊 -->
    <rect x="72" y="23" width="27" height="8.5" rx="4.2" fill="#FFFFFF" opacity="0.28"/>
    <circle cx="80" cy="27.2" r="2.2" fill="#FFFFFF"/>
    <circle cx="92" cy="27.2" r="1.7" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>

    <!-- 主信息卡 -->
    <circle cx="27" cy="47" r="10" fill="#FFFFFF" opacity="0.22"/>
    <circle cx="27" cy="47" r="6" fill="#FFFFFF" opacity="0.85"/>
    <rect x="42" y="41" width="30" height="4.6" rx="2.3" fill="#FFFFFF"/>
    <rect x="42" y="50" width="40" height="3.6" rx="1.8" fill="#FFFFFF" opacity="0.65"/>
    <rect x="42" y="57" width="26" height="3.6" rx="1.8" fill="#FFFFFF" opacity="0.45"/>

    <!-- 搜索卡片 -->
    <rect x="12" y="53" width="88" height="20" rx="5.5" fill="#FFFFFF"/>
    <circle cx="23" cy="63" r="3.8" fill="none" stroke="#B9C6D6" stroke-width="1.5"/>
    <rect x="30" y="61" width="21" height="4" rx="2" fill="#DCE3EC"/>
    <rect x="63" y="61" width="30" height="4" rx="2" fill="#E8EDF3"/>

    <!-- 四个功能块 -->
    <g>
      <rect x="13" y="82" width="18" height="18" rx="5.5" fill="#25BFC0"/>
      <rect x="18" y="104" width="8" height="3.4" rx="1.7" fill="#CDD7E3"/>
    </g>
    <g>
      <rect x="36" y="82" width="18" height="18" rx="5.5" fill="#8B7CF0"/>
      <rect x="41" y="104" width="8" height="3.4" rx="1.7" fill="#CDD7E3"/>
    </g>
    <g>
      <rect x="59" y="82" width="18" height="18" rx="5.5" fill="#F0764A"/>
      <rect x="64" y="104" width="8" height="3.4" rx="1.7" fill="#CDD7E3"/>
    </g>
    <g>
      <rect x="82" y="82" width="18" height="18" rx="5.5" fill="#F5B33F"/>
      <rect x="87" y="104" width="8" height="3.4" rx="1.7" fill="#CDD7E3"/>
    </g>

    <!-- 图表卡片 -->
    <rect x="12" y="116" width="88" height="60" rx="5.5" fill="#FFFFFF"/>
    <rect x="18" y="122" width="22" height="4.4" rx="2.2" fill="#C6D2E0"/>
    <g stroke="#E4EAF2" stroke-width="1">
      <line x1="18" y1="138" x2="94" y2="138"/>
      <line x1="18" y1="151" x2="94" y2="151"/>
      <line x1="18" y1="164" x2="94" y2="164"/>
    </g>
    <path d="M 18 168 C 30 160 36 143 48 146 C 60 149 64 136 76 139 C 84 141 88 150 94 146"
          fill="none" stroke="#4E9BE0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 18 172 C 30 170 38 162 50 164 C 62 166 70 158 82 160 C 88 161 90 165 94 163"
          fill="none" stroke="#F0B95A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="146" r="3.2" fill="#1F73DB" stroke="#FFFFFF" stroke-width="1.4"/>

    <!-- 底部标签栏 -->
    <rect x="7.5" y="182" width="97" height="19.5" fill="#FFFFFF"/>
    <g fill="#A8B7C9">
      <rect x="22" y="189" width="9" height="6" rx="1.8"/>
      <circle cx="48" cy="192" r="3.1"/>
      <rect x="67" y="189" width="9" height="6" rx="1.8"/>
      <circle cx="92" cy="192" r="3.1"/>
    </g>
    <rect x="21" y="197" width="11" height="2.4" rx="1.2" fill="#2E86E8"/>
  </g>

  <!-- 刘海 -->
  <rect x="42" y="7.5" width="28" height="6.6" rx="3.3" fill="#333C48"/>
  <!-- 机身描边 -->
  <rect x="2" y="2" width="108" height="205" rx="16" fill="none" stroke="#273447" stroke-width="2.4"/>
</svg>
